<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#c8102e" />
    <meta name="description" content="LifeFlow — find blood donors and hospital blood stock fast." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="LifeFlow" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>LifeFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;600&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <script>
      // Catch the browser's install signal as early as possible, before the app starts,
      // so the Install banner can still use it later.
      window.__lifeflowInstallEvent = null;
      window.addEventListener("beforeinstallprompt", function (event) {
        event.preventDefault();
        window.__lifeflowInstallEvent = event;
        window.dispatchEvent(new Event("lifeflow-install-ready"));
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
